name: Docker CI/CD and Endpoint Verification Pipeline Test

on:
  push:
    branches:
      - main

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Build Docker Container Image
        run: docker build -t backend-service:latest ./pipeline

      - name: Run Conatiner in Detached Mode
        run: docker run -d -p 3000:3000 -e NODE_ENV=production --name test-container backend-service:latest

      - name: Verify  Environment Connection and Health Endpoint
        run: |
          sleep 3
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health)
          echo "Health endpoint returned HTTP status : $response"
          if [ "$response" != "200" ]; then
            echo "Endpoint verification failed!"
            exit 1
          fi
          curl -s http://localhost:3000/health

      - name: Stop and Clean Container
        if: always()
        run: docker stop test-container && docker rm test-container
